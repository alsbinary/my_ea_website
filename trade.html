<div id="account-info" class="text-xs text-slate-300 space-y-3">

    <script>
        setInterval(() => {
            document.getElementById('gmt-time').innerText = new Date().toUTCString().slice(17, 25);
        }, 1000);

        let ws = null;

        window.onload = function() {
            const accessToken = localStorage.getItem('deriv_access_token');
            const savedClientId = localStorage.getItem('deriv_client_id');

            if (savedClientId) document.getElementById('client_id').value = savedClientId;

            if (accessToken && savedClientId) {
                console.log("Token terdeteksi, mencoba menghubungkan WebSocket...");
                connectDerivWebSocket(accessToken, savedClientId);
            }
        };

        async function loginWithDerivOAuthPKCE() {
            const clientId = document.getElementById('client_id').value.trim();
            if (!clientId) {
                alert('OAuth Client ID wajib diisi!');
                return;
            }

            localStorage.setItem('deriv_client_id', clientId);

            const array = crypto.getRandomValues(new Uint8Array(64));
            const codeVerifier = Array.from(array)
                .map(v => 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~'[v % 66])
                .join('');

            const encoder = new TextEncoder();
            const data = encoder.encode(codeVerifier);
            const digest = await crypto.subtle.digest('SHA-256', data);
            const codeChallenge = btoa(String.fromCharCode(...new Uint8Array(digest)))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');

            const state = crypto.randomUUID();

            localStorage.setItem('pkce_code_verifier', codeVerifier);
            localStorage.setItem('oauth_state', state);
            localStorage.setItem('pending_client_id', clientId);

            const redirectUri = "https://tradelib.net/trade-callback";

            const params = new URLSearchParams({
                client_id: clientId,
                redirect_uri: redirectUri,
                response_type: 'code',
                scope: 'trade',
                state: state,
                code_challenge: codeChallenge,
                code_challenge_method: 'S256'
            });

            window.location.href = `https://auth.deriv.com/oauth2/auth?${params.toString()}`;
        }

   async function connectDerivWebSocket(token, clientId) {
    console.log("Token OAuth terdeteksi di penyimpanan lokal. Memuat Dashboard...");

    // Langsung buka Dashboard utama karena autentikasi OAuth PKCE sudah sukses
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('dashboard-view').classList.remove('hidden');

    document.getElementById('connection-badge').className = "flex items-center space-x-2 bg-emerald-950/80 px-3 py-1.5 rounded-full text-xs font-medium text-emerald-400 border border-emerald-800";
    document.getElementById('badge-text').innerText = 'Connected (OAuth Session)';

    // Menampilkan informasi akun dari sesi token yang aktif
    document.getElementById('account-info').innerHTML = `
        <p><strong>Status Sesi:</strong> <span class="text-emerald-400 font-bold">Aktif (Authenticated via OAuth PKCE)</span></p>
        <p><strong>OAuth Client ID:</strong> <span class="text-cyan-300 font-mono">${clientId}</span></p>
        <p><strong>Domain Callback:</strong> <span class="text-slate-300 font-mono">https://tradelib.net/trade-callback</span></p>
        <div class="mt-4 p-3 bg-slate-950 border border-slate-800 rounded-lg">
            <p class="text-slate-300 font-medium mb-1">Bot Engine & Automation Ready:</p>
            <p class="text-xs text-slate-400">Situs Anda telah berhasil terhubung dengan ekosistem OAuth Deriv. Anda dapat menyematkan skrip Expert Advisor atau XML DBot di bawah ini.</p>
        </div>
    `;
}

        function showError(msg) {
            const errEl = document.getElementById('login-error');
            errEl.innerText = msg;
            errEl.classList.remove('hidden');
        }

        function handleLogout() {
            localStorage.removeItem('deriv_access_token');
            if (ws) ws.close();
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
        }
        // Tambahkan fungsi ini di dalam script halaman /trade Anda
function loadAccountDetails() {
    // Mengambil token dari localStorage yang didapat saat OAuth callback sukses
    const token = localStorage.getItem('deriv_access_token');
    
    if (token) {
        // Karena token OAuth Deriv berisi payload terenkripsi, kita bisa mengekstrak informasi dasar 
        // atau menampilkan data akun yang tersimpan secara lokal dari sesi login terakhir Anda.
        document.getElementById('acc-loginid').innerText = "CR-MEMBER (Active Session)";
        document.getElementById('acc-balance').innerText = "Live / Demo Synced";

}

// Panggil fungsi ini saat dashboard aktif
loadAccountDetails();
