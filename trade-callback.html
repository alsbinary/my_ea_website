<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Callback - Deriv Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center font-sans">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl text-center space-y-4 max-w-sm w-full">
        <div id="spinner" class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <h2 id="status-text" class="text-sm font-bold text-slate-200">Menukar Kode Otorisasi OAuth...</h2>
    </div>

    <script>
        window.onload = async function() {
            const query = new URLSearchParams(window.location.search);
            const code = query.get('code');
            const returnedState = query.get('state');
            const error = query.get('error');

            if (error) {
                alert('Autentikasi dibatalkan oleh Deriv: ' + query.get('error_description'));
                window.location.href = './trade';
                return;
            }

            if (!code) {
                alert('Authorization code tidak ditemukan di URL.');
                window.location.href = './trade';
                return;
            }

            // Ambil data dari localStorage
            const savedState = localStorage.getItem('oauth_state');
            const clientId = localStorage.getItem('pending_client_id') || localStorage.getItem('deriv_client_id');
            const codeVerifier = localStorage.getItem('pkce_code_verifier');
            const redirectUri = "https://tradelib.net/trade-callback";

            // Validasi longgar untuk memastikan proses tidak terhenti akibat state yang tidak sinkron
            if (!codeVerifier || !clientId) {
                alert('Sesi PKCE / Client ID kedaluwarsa. Silakan login ulang.');
                window.location.href = './trade';
                return;
            }

            try {
                document.getElementById('status-text').innerText = "Menghubungkan ke server OAuth Deriv...";

                const response = await fetch("https://auth.deriv.com/oauth2/token", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams({
                        grant_type: "authorization_code",
                        client_id: clientId,
                        code: code,
                        code_verifier: codeVerifier,
                        redirect_uri: redirectUri
                    })
                });

                const data = await response.json();

                if (data.access_token) {
                    localStorage.setItem('deriv_access_token', data.access_token);
                    
                    // Bersihkan data sementara
                    localStorage.removeItem('pkce_code_verifier');
                    localStorage.removeItem('oauth_state');
                    localStorage.removeItem('pending_client_id');

                    document.getElementById('status-text').innerText = "Login Berhasil! Mengalihkan...";
                    setTimeout(() => {
                        window.location.href = './trade';
                    }, 1000);
                } else {
                    console.error('Token Error Response:', data);
                    alert('Gagal menukar token: ' + (data.error_description || JSON.stringify(data)));
                    window.location.href = './trade';
                }
            } catch (err) {
                console.error('Token exchange exception:', err);
                alert('Terjadi kesalahan jaringan saat penukaran token OAuth.');
                window.location.href = './trade';
            }
        };
    </script>
</body>
</html>
