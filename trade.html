<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALS Pro - Deriv Trading Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-black px-3 py-1.5 rounded-lg text-xs tracking-wider shadow">ALS PRO</div>
            <h1 class="text-sm font-bold tracking-wide text-slate-200">Advanced Level Strategy Web Engine</h1>
        </div>
        <div class="flex items-center space-x-4">
            <div id="connection-badge" class="flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-full text-xs font-medium text-amber-400 border border-slate-700">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
                <span id="badge-text">Terputus</span>
            </div>
            <div class="text-xs text-slate-400 hidden md:block">GMT: <span id="gmt-time" class="text-slate-200 font-mono">-</span></div>
        </div>
    </header>

    <!-- VIEW 1: LOGIN -->
    <div id="login-view" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-8 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="inline-block bg-blue-600/20 text-blue-400 font-semibold px-3 py-1 rounded-full text-xs border border-blue-500/30">OAuth 2.0 PKCE Gateway</div>
                <h2 class="text-lg font-bold text-white">Masuk ke Dashboard Bot</h2>
                <p class="text-xs text-slate-400">Masukkan OAuth Client ID (Alfanumerik) Anda.</p>
            </div>

            <div class="space-y-4 text-xs">
                <div>
                    <label class="block font-medium text-slate-400 mb-1">OAuth Client ID (Alfanumerik)</label>
                    <input type="text" id="client_id" value="34M4TGKofeTRkL0lcJ9zO" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2.5 text-slate-200 focus:outline-none focus:border-blue-500">
                </div>
                
                <button onclick="loginWithDerivOAuthPKCE()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-3 rounded-xl transition shadow-lg tracking-wider">LOGIN VIA DERIV (OAUTH PKCE)</button>
            </div>
            <div id="login-error" class="text-rose-400 text-xs text-center hidden"></div>
        </div>
    </div>

    <!-- VIEW 2: DASHBOARD -->
    <main id="dashboard-view" class="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 hidden">
        <div class="lg:col-span-12 bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h2 class="text-sm font-bold text-emerald-400 uppercase tracking-widest flex items-center">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 mr-2 animate-pulse"></span> Connected via OAuth PKCE Token
                </h2>
                <button onclick="handleLogout()" class="text-rose-400 hover:text-rose-300 underline text-xs">Keluar / Switch Akun</button>
            </div>
            <div id="account-info" class="text-xs text-slate-300 space-y-2">
                <p class="animate-pulse">Memuat data akun dari WebSocket...</p>
            </div>
        </div>
    </main>

    <script>
        setInterval(() => {
            document.getElementById('gmt-time').innerText = new Date().toUTCString().slice(17, 25);
        }, 1000);

        let ws = null;

        window.onload = function() {
            const accessToken = localStorage.getItem('deriv_access_token');
            const savedClientId = localStorage.getItem('deriv_client_id');

            if (savedClientId) document.getElementById('client_id').value = savedClientId;

            if (accessToken && savedClientId) {
                console.log("Token terdeteksi, mencoba menghubungkan WebSocket...");
                connectDerivWebSocket(accessToken, savedClientId);
            }
        };

        async function loginWithDerivOAuthPKCE() {
            const clientId = document.getElementById('client_id').value.trim();
            if (!clientId) {
                alert('OAuth Client ID wajib diisi!');
                return;
            }

            localStorage.setItem('deriv_client_id', clientId);

            const array = crypto.getRandomValues(new Uint8Array(64));
            const codeVerifier = Array.from(array)
                .map(v => 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~'[v % 66])
                .join('');

            const encoder = new TextEncoder();
            const data = encoder.encode(codeVerifier);
            const digest = await crypto.subtle.digest('SHA-256', data);
            const codeChallenge = btoa(String.fromCharCode(...new Uint8Array(digest)))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');

            const state = crypto.randomUUID();

            localStorage.setItem('pkce_code_verifier', codeVerifier);
            localStorage.setItem('oauth_state', state);
            localStorage.setItem('pending_client_id', clientId);

            const redirectUri = "https://tradelib.net/trade-callback";

            const params = new URLSearchParams({
                client_id: clientId,
                redirect_uri: redirectUri,
                response_type: 'code',
                scope: 'trade',
                state: state,
                code_challenge: codeChallenge,
                code_challenge_method: 'S256'
            });

            window.location.href = `https://auth.deriv.com/oauth2/auth?${params.toString()}`;
        }

        function connectDerivWebSocket(token, clientId) {
            const wsUrl = `wss://ws.binaryws.com/websockets/v3?app_id=${clientId}`;
            console.log("Menghubungkan ke WebSocket URL:", wsUrl);

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log("WebSocket Terhubung, mengirim request authorize...");
                ws.send(JSON.stringify({ authorize: token }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log("WebSocket Message Received:", data);

                if (data.msg_type === 'authorize') {
                    if (data.error) {
                        showError('Otorisasi Gagal: ' + data.error.message);
                        console.error('Otorisasi Error:', data.error);
                    } else {
                        // Tampilkan Dashboard jika otorisasi sukses
                        document.getElementById('login-view').classList.add('hidden');
                        document.getElementById('dashboard-view').classList.remove('hidden');

                        document.getElementById('connection-badge').className = "flex items-center space-x-2 bg-emerald-950/80 px-3 py-1.5 rounded-full text-xs font-medium text-emerald-400 border border-emerald-800";
                        document.getElementById('badge-text').innerText = 'Connected';

                        const auth = data.authorize;
                        document.getElementById('account-info').innerHTML = `
                            <p><strong>Login ID:</strong> <span class="text-cyan-300 font-mono font-bold">${auth.loginid}</span></p>
                            <p><strong>Nama Pemilik:</strong> ${auth.fullname || 'Trader'}</p>
                            <p><strong>Email:</strong> ${auth.email}</p>
                            <p><strong>Saldo Utama:</strong> <span class="text-emerald-400 font-bold">$${parseFloat(auth.balance).toFixed(2)} ${auth.currency}</span></p>
                        `;
                    }
                }
            };

            ws.onerror = (err) => {
                console.error('WebSocket Error Event:', err);
                showError('Koneksi WebSocket gagal terhubung ke server Deriv.');
            };

            ws.onclose = (event) => {
                console.warn('WebSocket Terputus:', event);
                document.getElementById('connection-badge').className = "flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-full text-xs font-medium text-amber-400 border border-slate-700";
                document.getElementById('badge-text').innerText = 'Terputus';
            };
        }

        function showError(msg) {
            const errEl = document.getElementById('login-error');
            errEl.innerText = msg;
            errEl.classList.remove('hidden');
        }

        function handleLogout() {
            localStorage.removeItem('deriv_access_token');
            if (ws) ws.close();
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
        }
    </script>
</body>
</html>
